# Geliştirme altyapısı: Postgres (pgvector) + Redis
# Başlat: docker compose up -d
#
# Dosya depolama varsayılan olarak yerel diskte (STORAGE_DRIVER=local, ./storage).
# S3 uyumlu depolama gerekirse (production) Cloudflare R2 / AWS S3 / kendi MinIO kurulumunuzu
# .env içindeki S3_* değişkenleriyle bağlayın.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: salesos
      POSTGRES_PASSWORD: salesos
      POSTGRES_DB: salesos
    ports: ["55432:5432"]  # 5432/5433 yerel Postgres kurulumlarıyla çakışmasın diye
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata:
